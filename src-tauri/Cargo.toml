[package]
name = "mc-launcher"
version = "0.1.0"
description = "A full-featured open source Minecraft launcher"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# HTTP（用 rustls，避免 OpenSSL 依赖）
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "rustls-tls",
    "stream",
] }

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 工具
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
sha1 = "0.10"
md5 = "0.7"
hex = "0.4"

# 文件遍历 / 解压
walkdir = "2"
zip = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
