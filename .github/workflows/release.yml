name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（已存在，如 v0.1.0）"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 安装包并发布
    runs-on: windows-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 装 pnpm
        uses: pnpm/action-setup@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建安装包（带签名）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: 生成 latest.json（updater 检查用）
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/make-latest-json.mjs

      - name: 确认产物
        id: artifact
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          FILE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::没有生成安装包"
            exit 1
          fi
          SIG=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig | head -1)
          if [ -z "$SIG" ]; then
            echo "::error::没有生成签名文件 .sig —— 检查 TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "产物: $FILE ($(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE") 字节)"
          echo "签名: $SIG"

      - name: 发布到 GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          NOTES="docs/release-notes-${TAG}.md"
          [ -f "$NOTES" ] || NOTES="docs/release-notes.md"

          ASSETS=("${{ steps.artifact.outputs.file }}" "${{ steps.artifact.outputs.sig }}" latest.json)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新附件"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [ -f "$NOTES" ]; then
            echo "用 $NOTES 当发布说明"
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --notes-file "$NOTES"
          else
            echo "没有说明文件，自动生成"
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --generate-notes
          fi

          echo "完成: $(gh release view "$TAG" --json url --jq .url)"
